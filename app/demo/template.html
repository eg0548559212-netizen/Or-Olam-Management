<title>אור עולם · ניהול הקו</title>

<style>
/* Layout: מעטפת ניהול — פס אייקונים בצד ימין, סרגל עליון, ותוכן בכרטיסים רכים ומעוגלים */
:root {
  --bg: #edf2f1;
  --surface: #ffffff;
  --surface-2: #f4f8f7;
  --ink: #142233;
  --ink-2: #5a6876;
  --ink-3: #8b97a3;

  --teal: #2ea6a8;
  --teal-strong: #1d7f81;

  --teal-softer: #ebf7f6;
  --sun: #f2b42c;
  --sun-strong: #a8740a;
  --sun-soft: #fcefc8;
  --navy: #182437;
  --on-navy: #f3f6f8;
  --ok: #2b9a68;
  --ok-soft: #dcf2e7;
  --warn: #d4721f;
  --warn-soft: #fbe7d6;
  --bad: #cf4848;
  --bad-soft: #f8dede;
  --new: #b8388f;
  --new-soft: #f6dcee;
  --special: #3b68cf;
  --special-soft: #dfe7fa;
  --shadow: 0 1px 2px rgba(20, 34, 51, .04), 0 8px 24px rgba(20, 34, 51, .05);
  --f-display: "Rubik", "Assistant", "Segoe UI", system-ui, sans-serif;
  --f-body: "Assistant", "Rubik", "Segoe UI", system-ui, sans-serif;
  --f-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r-card: 26px;
  --r-inner: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1520; --surface: #152132; --surface-2: #1b293d; --ink: #e7eef3; --ink-2: #a2b0bd; --ink-3: #75838f;
    --line: #243349; --teal: #4cc2c3; --teal-strong: #7fd8d8; --teal-soft: #173d45; --teal-softer: #142f38;
    --sun: #f5c24c; --sun-strong: #f5c24c; --sun-soft: #3a3120; --navy: #0a111b; --on-navy: #e7eef3;
    --ok: #55c08f; --ok-soft: #173a2c; --warn: #eb9a52; --warn-soft: #3d2a19; --bad: #ec7676; --bad-soft: #3e1f23;
    --new: #e27cc3; --new-soft: #3b1f34; --special: #84a6f2; --special-soft: #1f2b47;
    --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1520; --surface: #152132; --surface-2: #1b293d; --ink: #e7eef3; --ink-2: #a2b0bd; --ink-3: #75838f;
  --line: #243349; --teal: #4cc2c3; --teal-strong: #7fd8d8; --teal-soft: #173d45; --teal-softer: #142f38;
  --sun: #f5c24c; --sun-strong: #f5c24c; --sun-soft: #3a3120; --navy: #0a111b; --on-navy: #e7eef3;
  --ok: #55c08f; --ok-soft: #173a2c; --warn: #eb9a52; --warn-soft: #3d2a19; --bad: #ec7676; --bad-soft: #3e1f23;
  --new: #e27cc3; --new-soft: #3b1f34; --special: #84a6f2; --special-soft: #1f2b47;
  --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.path { font-family: var(--f-mono); font-size: .86em; direction: ltr; unicode-bidi: isolate; letter-spacing: -.01em; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 500; margin: 0; text-wrap: balance; }

/* ── מעטפת ── */
.app { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 20px; min-height: 100vh;
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1500px; margin: 0 auto; }
.rail { background: var(--surface); border-radius: 999px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center;
  gap: 8px; padding: 14px 0; position: sticky; top: max(20px, env(safe-area-inset-top, 0px)); height: calc(100vh - 40px); }
.brand-dot { width: 54px; height: 54px; border-radius: 50%; background: var(--navy); display: grid; place-items: center; margin-bottom: 12px; }
.rail a { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); position: relative; text-decoration: none; }
.rail a:hover { background: var(--surface-2); color: var(--ink); }
.rail a.on { background: var(--teal); color: #fff; }
.rail a .soon { position: absolute; top: 9px; left: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--sun); }
.rail .spacer { flex: 1; }
.rail svg { width: 22px; height: 22px; }
.rail a[data-tip]:hover::after { content: attr(data-tip); position: absolute; right: 58px; white-space: nowrap; background: var(--navy); color: var(--on-navy);
  font-size: 13px; padding: 5px 12px; border-radius: 999px; z-index: 5; pointer-events: none; }

.main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.wordmark { display: flex; align-items: center; gap: 10px; margin-left: 8px; }
.wordmark b { font-family: var(--f-display); font-weight: 600; font-size: 21px; letter-spacing: -.01em; }
.wordmark span { color: var(--ink-3); font-size: 13px; display: block; margin-top: -3px; }
.search { flex: 1 1 260px; max-width: 460px; display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 999px; padding: 0 18px; height: 50px; box-shadow: var(--shadow); }
.search input { border: 0; background: none; outline: none; flex: 1; min-width: 0; }
.search svg { width: 19px; color: var(--ink-3); flex: none; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 50px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--surface); box-shadow: var(--shadow); white-space: nowrap; }
.pill.teal { background: var(--teal-soft); color: var(--teal-strong); box-shadow: none; font-weight: 600; }
.top .grow { flex: 1; }
.user { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 999px; padding: 6px 6px 6px 16px; box-shadow: var(--shadow); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--sun-soft); color: var(--sun-strong); display: grid; place-items: center; font-family: var(--f-display); font-weight: 600; }
.user small { display: block; color: var(--ink-3); font-size: 12px; margin-top: -3px; }
.badge-role { background: var(--sun-soft); color: var(--sun-strong); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
.icon-btn { width: 50px; height: 50px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink-2); }
.icon-btn svg { width: 20px; }

/* ── כרטיסים ── */
.grid { display: grid; gap: 20px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 22px 24px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.card.tint { background: var(--teal-softer); box-shadow: none; }
.card.sun { background: var(--sun-soft); box-shadow: none; }
.card-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-h h2 { font-size: 19px; flex: 1; min-width: 0; }
.card-h .sub { color: var(--ink-3); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 11px; font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.teal { background: var(--teal-soft); color: var(--teal-strong); }
.chip.sun { background: var(--sun-soft); color: var(--sun-strong); }
.chip.new { background: var(--new-soft); color: var(--new); }
.chip.special { background: var(--special-soft); color: var(--special); }
.chip.line { background: none; border: 1px solid var(--line); font-weight: 500; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.ghost { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--ink-2); }
.ghost:hover { background: var(--surface-2); color: var(--ink); }
.ghost.on { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.cta { border: 0; border-radius: 999px; padding: 10px 20px; background: var(--teal); color: #fff; font-weight: 600; }
.cta:hover { background: var(--teal-strong); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px; }
.kpi small { color: var(--ink-3); font-size: 13px; display: block; }
.kpi b { font-family: var(--f-display); font-weight: 500; font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi b.sm { font-size: 22px; }

.stack { display: flex; height: 44px; border-radius: 14px; overflow: hidden; gap: 3px; }
.stack > div { min-width: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-left: 6px; vertical-align: -1px; }

.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 9em) minmax(0, 1fr) 3.5em; gap: 10px; align-items: center; font-size: 14px; border: 0; background: none; padding: 0; text-align: right; }
.bar-row .track { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar-row .fill { height: 100%; border-radius: 999px; }
.bar-row .n { text-align: left; }
button.bar-row:hover .track { outline: 1px solid var(--line); }

.health { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.health > div { background: var(--surface-2); border-radius: var(--r-inner); padding: 14px 16px; }
.health small { color: var(--ink-2); font-size: 13px; display: block; }
.health b { font-family: var(--f-display); font-weight: 500; font-size: 24px; font-variant-numeric: tabular-nums; }
.health .of { color: var(--ink-3); font-size: 13px; }

.ai { background: var(--navy); color: var(--on-navy); }
.ai .card-h .sub { color: rgba(243, 246, 248, .6); }
.ai-orb { height: 120px; border-radius: var(--r-inner); background:
  radial-gradient(circle at 30% 40%, rgba(242, 180, 44, .85), transparent 42%),
  radial-gradient(circle at 70% 60%, rgba(46, 166, 168, .9), transparent 46%),
  radial-gradient(circle at 50% 50%, rgba(46, 166, 168, .25), transparent 70%); }
.ai-input { display: flex; gap: 10px; align-items: center; background: rgba(255, 255, 255, .08); border-radius: 18px; padding: 10px 14px; font-size: 14px; color: rgba(243, 246, 248, .75); }
.ai-input span { flex: 1; }
.ai-input .go { width: 36px; height: 36px; border-radius: 50%; background: var(--sun); color: #182437; display: grid; place-items: center; flex: none; }

/* ── עץ ── */
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 999px; padding: 0 14px; height: 40px; flex: 1 1 180px; min-width: 0; }
.field input { border: 0; background: none; outline: none; flex: 1; min-width: 0; }
.field svg { width: 16px; color: var(--ink-3); flex: none; }
select.ghost { appearance: none; padding-left: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: 14px 52%, 19px 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.tree { max-height: calc(100vh - 290px); min-height: 420px; overflow: auto; margin-inline: -10px; padding-inline: 10px; }
.trow { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: right; padding: 6px 8px; border-radius: 12px; min-height: 38px; }
.trow:hover { background: var(--surface-2); }
.trow.sel { background: var(--teal-soft); }
.trow .tw { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); flex: none; }
.trow .tw svg { width: 14px; transition: transform .15s; }
.trow .tw.open svg { transform: rotate(-90deg); }
.trow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .nm.empty { color: var(--ink-3); font-style: italic; }
.trow .path { color: var(--ink-3); flex: none; }
.ctype { font-family: var(--f-mono); font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); flex: none; }
.trow.sel .ctype { background: var(--surface); }
.mark-bad { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; }
.empty-note { color: var(--ink-3); padding: 24px 8px; text-align: center; }

.detail-h { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.detail-h .big { font-family: var(--f-mono); font-size: 26px; direction: ltr; unicode-bidi: isolate; background: var(--teal-soft); color: var(--teal-strong); border-radius: 18px; padding: 8px 16px; }
.detail-h h2 { font-size: 24px; }
.detail-h .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; font-size: 13px; color: var(--ink-3); }
.crumbs button { border: 0; background: none; color: var(--ink-2); padding: 0; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.crumbs button:hover { color: var(--teal-strong); }
.sec h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
.sec h3 .chip { font-weight: 500; }
.kv { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); border: 1px solid var(--line); border-radius: var(--r-inner); overflow: hidden; }
.kv > div { padding: 9px 14px; border-top: 1px solid var(--line); font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.kv > div:nth-child(-n+2) { border-top: 0; }
.kv .k { color: var(--ink-2); background: var(--surface-2); }
.kv .k code { display: block; font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); direction: ltr; text-align: right; }
.kv .v code { font-family: var(--f-mono); font-size: 12px; direction: ltr; unicode-bidi: isolate; white-space: pre-wrap; }
.refs { display: flex; flex-direction: column; gap: 6px; }
.ref { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 9px 14px; border-radius: 14px; background: var(--surface-2); font-size: 14px; }
.ref .what { color: var(--ink-2); font-size: 13px; }
.ref button.to { border: 0; background: none; padding: 0; color: var(--teal-strong); text-align: right; }
.ref button.to:hover { text-decoration: underline; }
.muted { color: var(--ink-3); font-size: 13px; }

/* ── תכנון ── */
.plan-row { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 14px; align-items: start; padding: 8px 10px; border-radius: 14px; }
.plan-row:hover { background: var(--surface-2); }
.plan-node { display: flex; gap: 8px; align-items: flex-start; min-width: 0; }
.digit { min-width: 30px; height: 30px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 600; font-size: 14px; flex: none; }
.digit.existing { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.digit.new { background: var(--new-soft); color: var(--new); }
.digit.new_special_build { background: var(--special-soft); color: var(--special); }
.digit.unknown { background: var(--surface-2); color: var(--ink-3); }
.digit.none { background: none; border: 1px dashed var(--ink-3); color: var(--ink-3); }
.plan-node .t { min-width: 0; }
.plan-node .t b { font-weight: 600; }
.plan-node .t .path { color: var(--ink-3); margin-inline-start: 6px; }
.plan-node.heading .t b { font-family: var(--f-display); font-size: 17px; font-weight: 500; }
.notes { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.note { font-size: 13px; padding: 5px 10px; border-radius: 10px; display: flex; gap: 8px; align-items: baseline; }
.note.question { background: var(--bad-soft); color: var(--bad); }
.note.build_note { background: var(--warn-soft); color: var(--warn); }
.note.comment { background: var(--surface-2); color: var(--ink-2); }
.note b { font-weight: 600; flex: none; }
.map { display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line); min-width: 0; }
.map.none { border-style: dashed; color: var(--ink-3); font-size: 13px; }
.map .line1 { display: flex; gap: 8px; align-items: center; min-width: 0; }
.map .line1 button { border: 0; background: none; padding: 0; color: var(--ink); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.map .line1 button:hover { color: var(--teal-strong); text-decoration: underline; }
.conf { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); }
.conf .track { flex: 1; height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; max-width: 120px; }
.conf .fill { height: 100%; border-radius: 999px; }
.reasons { font-size: 12px; color: var(--warn); }
.plan-head { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 14px; padding: 0 10px; color: var(--ink-3); font-size: 13px; font-weight: 600; }
.notes-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.notes-col { background: var(--surface-2); border-radius: var(--r-inner); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.notes-col h3 { font-size: 15px; font-weight: 600; }
.notes-col ul { margin: 0; padding: 0 18px 0 0; font-size: 14px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }

/* ── דוח פערים ── */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { border: 0; text-align: right; background: var(--surface); box-shadow: var(--shadow); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.tile:hover { outline: 1px solid var(--line); }
.tile.on { background: var(--navy); color: var(--on-navy); }
.tile.on small { color: rgba(243, 246, 248, .7); }
.tile b { font-family: var(--f-display); font-weight: 500; font-size: 26px; font-variant-numeric: tabular-nums; }
.tile small { color: var(--ink-2); font-size: 13px; }
.tile .sev { width: 8px; height: 8px; border-radius: 50%; }
.table-wrap { overflow-x: auto; margin-inline: -8px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px; }
th { text-align: right; font-weight: 600; color: var(--ink-3); font-size: 13px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td .linkish { border: 0; background: none; padding: 0; color: var(--teal-strong); }
td .linkish:hover { text-decoration: underline; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 14px; color: var(--ink-2); }

/* ── מסכים בהגדרה ── */
.soon-card { align-items: flex-start; }
.soon-card .tag { background: var(--sun-soft); color: var(--sun-strong); }
.soon-list { margin: 0; padding: 0 20px 0 0; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; max-width: 65ch; }

.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; } .c5 { grid-column: span 5; } .c4 { grid-column: span 4; } .c3 { grid-column: span 3; }
@media (max-width: 1180px) { .c4, .c3 { grid-column: span 6; } .c8, .c7, .c5 { grid-column: span 12; } .split { grid-template-columns: minmax(0, 1fr); } .tree { max-height: 460px; min-height: 0; } }

function treeRows() {
  const out = [];
  const q = state.q.trim().toLowerCase();
  if (q || state.type || state.brokenOnly) {
    const hits = [];
    for (const e of EXT.values()) {
      if (state.type && e.type !== state.type) continue;
      if (state.brokenOnly && !BROKEN.has(e.id)) continue;
      if (q && !((e.name || "").toLowerCase().includes(q) || e.path.startsWith(q) || String(e.id) === q)) continue;
      hits.push(e);
    }
    hits.sort((a, b) => sortKey(a.path) < sortKey(b.path) ? -1 : 1);
    return { flat: true, rows: hits.slice(0, 400).map(e => ({ e, depth: 0 })), total: hits.length };
  }
  const walk = (ids, depth) => { for (const id of ids) { const e = EXT.get(id); out.push({ e, depth }); if (state.open.has(id)) walk(KIDS.get(id) || [], depth + 1); } };
  walk(ROOTS, 0);
  return { flat: false, rows: out, total: out.length };
}
function rowHtml({ e, depth }, flat) {
  const kids = KIDS.get(e.id) || [];
  return `<button class="trow${state.sel === e.id ? " sel" : ""}" data-id="${e.id}" style="padding-inline-start:${8 + depth * 18}px">
    <span class="tw${state.open.has(e.id) ? " open" : ""}" data-tw="${kids.length && !flat ? e.id : ""}">${kids.length && !flat ? ICON_CHEV : ""}</span>
    <span class="path">${esc(e.path)}</span>
    <span class="nm${e.name ? "" : " empty"}">${esc(e.name || "בלי שם")}</span>
    ${BROKEN.has(e.id) ? '<span class="mark-bad" title="יש הפניה שבורה"></span>' : ""}
    <span class="ctype">${esc(e.type || "—")}</span></button>`;
}

function fmtVal(v, enumTitles) {
  if (v && typeof v === "object" && !Array.isArray(v)) {
    if (v.$hidden) return '<span class="chip sun">מוסתר · נחשף רק למנהל הראשי</span>';

    if (v.$unknown) return '<span class="chip line">לא ידוע (הושחר בייצוא)</span>';
  }
  if (enumTitles) { const t = enumTitles[JSON.stringify(v)]; if (t) return esc(t); }
  if (v === true) return '<span class="chip ok">כן</span>';
  if (v === false) return '<span class="chip">לא</span>';
  if (v === null || v === "") return '<span class="muted">ריק</span>';
  if (typeof v === "object") {
    const s = JSON.stringify(v, (k, x) => x && typeof x === "object" && x.$hidden ? "‹מוסתר›" : x, 1);
    return `<code>${esc(s.length > 700 ? s.slice(0, 700) + " …" : s)}</code>`;
  }
  return esc(v);
}

  $("#dec-none")?.addEventListener("click", () => decide("none", []));
  $("#dec-other")?.addEventListener("click", () => { pstate.panel = pstate.panel === "search" ? null : "search"; renderPlanDetail(); });
  $("#dec-adv")?.addEventListener("click", () => { pstate.panel = pstate.panel === "adv" ? null : "adv"; renderPlanDetail(); });
  $("#dec-edit")?.addEventListener("click", () => { pstate.editing = true; renderPlanDetail(); });
  $("#dec-cancel")?.addEventListener("click", () => { pstate.editing = false; pstate.panel = null; renderPlanDetail(); });
  $("#dec-next")?.addEventListener("click", () => nextInQueue());
  searchInto($("#pick-q"), $("#pick-r"), id => decide("same", [id]));
  if (pstate.panel === "adv") {
    const f = pstate.form;
    el.querySelectorAll('input[name="act"]').forEach(r => r.addEventListener("change", () => {
      f.action = r.value; const a = ACTIONS[f.action]; if (f.ids.length > a.max) f.ids = f.ids.slice(0, a.max); renderPlanDetail();
    }));
    el.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => { f.ids = f.ids.filter(x => x !== +b.dataset.rm); renderPlanDetail(); }));
    $("#dec-note")?.addEventListener("input", e => { f.note = e.target.value; });
    searchInto($("#adv-q"), $("#adv-r"), id => { const a = ACTIONS[f.action]; f.ids = a.max === 1 ? [id] : [...new Set([...f.ids, id])].slice(0, a.max); renderPlanDetail(); });
    $("#adv-save")?.addEventListener("click", () => decide(f.action, f.ids, f.note));
  }
}
async function undoDecision(nodeId, prev) {
  if (prev) { await saveDecision(nodeId, { action: prev.action, ids: prev.sclass_ids || [], note: prev.note }, prev.source || "manual"); }
  else { DEC.delete(nodeId); if (DB && CAN_WRITE !== false) { try { await DB.doc("decisions/" + nodeId).delete(); } catch (e) {} } }
  drawQueueBar(); selectNode(nodeId, true);
}
let toastTimer = null;
function toast(text, undo) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status"); document.getElementById("app").appendChild(t); }
  t.innerHTML = `<span>${esc(text)}</span>${undo ? '<button id="toast-undo">ביטול</button>' : ""}`;
  t.hidden = false;
  if (undo) $("#toast-undo").addEventListener("click", () => { t.hidden = true; undo(); });
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 7000);
}
async function saveDecision(nodeId, f, source) {
  const doc = { node_id: nodeId, action: f.action, sclass_ids: f.ids, note: f.note || "", decided_by: MY_ID, decided_at: new Date().toISOString(), source };
  DEC.set(nodeId, doc);
  if (!DB || CAN_WRITE === false) return false;
  try { await DB.doc("decisions/" + nodeId).set(doc); return true; }
  catch (e) { if (e && e.code === "invalid_argument") CAN_WRITE = false; return false; }
}
function globalNotesHtml() {
  const g = k => NOTES_BY.get("global:" + k) || [];
  const col = (t, list) => `<div class="notes-col"><h3>${t}</h3><ul>${list.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  return `<div class="card-h"><h2>הערות כלליות בטיוטה</h2></div>
    <div class="notes-grid one">
      ${col("בכל הקו", g("global").filter(n => !n.text.startsWith("דרושים מוסרים")).map(n => n.text))}
      ${col("שאלות שנותרו", g("open_question").map(n => n.text))}
      ${col("דרושים מוסרים", g("global").filter(n => n.text.startsWith("דרושים מוסרים")).map(n => n.text.replace(/^דרושים מוסרים:\s*/, "")))}
    </div>`;
}
async function initDecisions() {
  try { USER = await window.claude?.use?.("user"); } catch (e) { USER = null; }
  try { DB = await window.claude?.use?.("db"); } catch (e) { DB = null; }
  if (USER) { try { MY_ID = await USER.id(); } catch (e) {} try { CAN_WRITE = await USER.can("data.write"); } catch (e) {} }
  if (!DB) { if (location.hash === "#plan") drawQueueBar(); return; }
  DB.collection("decisions").onSnapshot(async snap => {
    DEC.clear();
    for (const s of snap.docs) { const v = s.data(); if (v && v.node_id != null) DEC.set(+v.node_id, v); }
    const ids = [...new Set([...DEC.values()].map(v => v.decided_by).filter(Boolean))];
    if (USER && ids.length) { try { const ps = await USER.profiles(ids); for (const id of ids) NAMES[id] = ps[id]?.name || ""; } catch (e) {} }
    const view = (location.hash || "#home").slice(1);
    if (view === "plan") { drawQueueBar(); drawPlanTree(); if (!pstate.dirty) { pstate.form = null; renderPlanDetail(); } }
    else if (view === "home") renderHome();
  }, () => {});
  if (location.hash === "#plan") drawQueueBar();
}

/* ── דוח פערים ── */
function gapText(kind, d, nodeId, sid) {
  const ext = sid != null ? EXT.get(sid) : null;
  const p = x => x ? `<span class="path">${esc(x)}</span>` : "";
  switch (kind) {
    case "added": return `${p(d.path)} ${esc(d.title || "")} · ${NODE_STATUS[d.node_status]?.[0] || ""}`;
    case "existing_not_found": case "unnumbered": return `${p(d.path)} ${esc(d.title || "")}`;
    case "number_conflict": return d.reason === "duplicate_digit" ? `${p(d.path)} ${esc(d.title || "")} · הספרה ${esc(d.digit)} מופיעה פעמיים` : `${esc(d.title || "")} · בטיוטה כתוב ${p(d.stated_path)}, לפי המיקום ${p(d.path)}`;
    case "moved": return `${esc(d.title || "")}: ${p(d.old_path)} ← ${p(d.new_path) || "בלי נתיב"}`;
    case "renamed": return `${p(d.path)} "${esc(d.old_name || "בלי שם")}" ← "${esc(d.new_title || "")}"`;
    case "pattern_deviation": return `${p(d.path)} ${esc(d.title || "")} · חסרות: ${esc((d.missing || []).join(", "))}`;
    case "current_not_planned": return `${p(d.path)} ${esc(d.name || "בלי שם")} · ${esc(d.cls_type || "")} · ${fmt(d.descendants)} צאצאים${d.note ? " · " + esc(d.note) : ""}`;
    case "ref_needs_rewrite": return `${p(d.from_path)} · ${esc(d.setting_key)}: ${p(d.old_target)} ← ${p(d.new_target) || "?"}`;
    case "open_note": return esc(d.text);
    default: return esc(JSON.stringify(d));
  }
}
function renderGaps() {
  const counts = {};
  for (const g of D.gaps) counts[g[0]] = (counts[g[0]] || 0) + 1;
  $("#view").innerHTML = `<div class="grid">
    <section class="c12" style="display:flex;flex-direction:column;gap:14px">
      <div class="card-h" style="padding:0 6px"><h2 style="font-size:24px">דוח פערים</h2><span class="sub">טיוטת העבודה מול העץ הנוכחי · ${fmt(D.gaps.length)} פריטים</span></div>
      <div class="tiles">${Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, n]) =>
        `<button class="tile${state.gapKind === k ? " on" : ""}" data-k="${k}"><span class="sev" style="background:${SEV[GAP[k]?.[1]] || "var(--teal)"}"></span><b>${fmt(n)}</b><small>${GAP[k]?.[0] || k}</small></button>`).join("")}</div>
    </section>
    <section class="card c12">
      <div class="toolbar"><label class="field" for="q-gap">${ICON_SEARCH}<input id="q-gap" type="search" placeholder="חיפוש בדוח" value="${esc(state.gapQ)}" autocomplete="off"></label>
        <button class="ghost${state.gapKind ? "" : " on"}" id="g-all">כל הסוגים</button></div>
      <div class="table-wrap"><table><thead><tr><th style="width:170px">סוג</th><th style="width:90px">חומרה</th><th>פירוט</th><th style="width:120px"></th></tr></thead><tbody id="gap-body"></tbody></table></div>
      <div class="pager" id="gap-pager"></div>
    </section></div>`;
  const per = 50;
  const draw = () => {
    const q = state.gapQ.trim();
    const list = D.gaps.filter(g => (!state.gapKind || g[0] === state.gapKind) && (!q || JSON.stringify(g[4]).includes(q)));
    const pages = Math.max(1, Math.ceil(list.length / per)); state.gapPage = Math.min(state.gapPage, pages - 1);
    const slice = list.slice(state.gapPage * per, state.gapPage * per + per);
    const sevLabel = { info: ["מידע", "teal"], warning: ["אזהרה", "warn"], error: ["שגיאה", "bad"] };
    $("#gap-body").innerHTML = slice.map(([k, sev, node, sid, d]) => `<tr><td>${GAP[k]?.[0] || k}</td><td><span class="chip ${sevLabel[sev][1]}">${sevLabel[sev][0]}</span></td>
      <td>${gapText(k, d, node, sid)}</td><td>${["existing_not_found", "moved", "renamed", "unnumbered", "number_conflict"].includes(k) && node != null ? `<button class="linkish" data-nid="${node}">לצומת בטיוטה</button>` : sid != null && EXT.has(sid) ? `<button class="linkish" data-go="${sid}">לשלוחה בעץ</button>` : ""}</td></tr>`).join("")
      || '<tr><td colspan="4" class="empty-note">אין פריטים.</td></tr>';
    $("#gap-pager").innerHTML = pages > 1 ? `<button class="ghost" id="pg-prev" ${state.gapPage ? "" : "disabled"}>הקודם</button><span class="num">עמוד ${state.gapPage + 1} מתוך ${pages} · ${fmt(list.length)} פריטים</span><button class="ghost" id="pg-next" ${state.gapPage < pages - 1 ? "" : "disabled"}>הבא</button>` : `<span class="num">${fmt(list.length)} פריטים</span>`;
    $("#pg-prev")?.addEventListener("click", () => { state.gapPage--; draw(); });
    $("#pg-next")?.addEventListener("click", () => { state.gapPage++; draw(); });
    $("#gap-body").querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => openExt(+b.dataset.go)));
    $("#gap-body").querySelectorAll("[data-nid]").forEach(b => b.addEventListener("click", () => openNode(+b.dataset.nid)));
  };
  draw();
  document.querySelectorAll(".tile").forEach(t => t.addEventListener("click", () => {
    state.gapKind = state.gapKind === t.dataset.k ? "" : t.dataset.k; state.gapPage = 0;
    document.querySelectorAll(".tile").forEach(x => x.classList.toggle("on", x.dataset.k === state.gapKind)); $("#g-all").classList.toggle("on", !state.gapKind); draw();
  }));
  $("#g-all").addEventListener("click", () => { state.gapKind = ""; state.gapPage = 0; renderGaps(); });
  $("#q-gap").addEventListener("input", e => { state.gapQ = e.target.value; state.gapPage = 0; draw(); });
}
